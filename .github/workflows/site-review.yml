name: Public portfolio review

# An existing daily workflow may call this job. Operators can also run it on demand.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04  # Playwright 1.56 Chromium supports this OS; ubuntu-latest moved to 26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check operator evidence
        run: node scripts/validate-forge-evidence.mjs
      - name: Check generated pages and sitemap
        run: node scripts/render-flagship-pages.mjs --check
      - name: Check public routes, anchors, assets and metadata
        run: python3 scripts/check-site.py
      - name: Install pinned browser test harness
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test every page at four viewport widths
        run: |
          python3 scripts/preview-site.py >/tmp/fr3k-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          node scripts/check-browser.cjs
