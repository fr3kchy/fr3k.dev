name: FR3K Capability Evidence Contract

on:
  workflow_call:
    inputs:
      project-id:
        description: Stable flagship ID from the FR3K portfolio catalog.
        required: true
        type: string
      capability-ids:
        description: JSON array containing the complete expected capability ID set.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate capability evidence manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned FR3K validator
        uses: actions/checkout@v4
        with:
          repository: fr3kchy/fr3k.dev
          ref: ca3d4c5f4ea08bde5a35c327b389dbd724c5c49d
          path: .fr3k-contract
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture capability contract context
        env:
          FR3K_PROJECT_ID: ${{ inputs.project-id }}
          FR3K_CAPABILITY_IDS: ${{ inputs.capability-ids }}
        run: |
          set -euo pipefail
          {
            printf 'repository=%s\\n' "$GITHUB_REPOSITORY"
            printf 'ref=%s\\n' "$GITHUB_REF"
            printf 'sha=%s\\n' "$GITHUB_SHA"
            printf 'project_id=%s\\n' "$FR3K_PROJECT_ID"
            printf 'capability_ids=%s\\n' "$FR3K_CAPABILITY_IDS"
            printf 'node=%s\\n' "$(node --version)"
            printf 'validator_commit=%s\\n' "$(git -C .fr3k-contract rev-parse HEAD)"
            if [[ -f .fr3k/flagship-status.json ]]; then echo 'manifest=present'; else echo 'manifest=missing'; fi
          } | tee capability-context.log

      - name: Validate manifest and evidence paths
        env:
          FR3K_PROJECT_ID: ${{ inputs.project-id }}
          FR3K_CAPABILITY_IDS: ${{ inputs.capability-ids }}
        shell: bash
        run: |
          set -o pipefail
          node .fr3k-contract/scripts/validate-flagship-manifest.mjs 2>&1 | tee capability-validation.log

      - name: Upload capability contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-contract-${{ inputs.project-id }}
          path: |
            capability-context.log
            capability-validation.log
            .fr3k/flagship-status.json
          if-no-files-found: warn
          retention-days: 14
